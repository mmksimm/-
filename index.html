<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memhash Web App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Code+Pro&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0E0E0E;
      --card-bg: #1A1A1A;
      --accent-stop: #FF5E5E;
      --badge-mining: #A8FF94;
      --badge-reward: #5B8CFF;
      --badge-reward-zero: #FFF084;
      --energy-bar: #7CFFC0;
      --text-header: #FFFFFF;
      --text-main: #CCCCCC;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
    }
    h1, h2 {
      font-weight: 600;
      color: var(--text-header);
      margin: 0 0 8px 0;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .label {
      font-size: 12px;
      color: var(--text-header);
    }
    .value {
      font-family: 'Source Code Pro', monospace;
      font-size: 14px;
    }
    .status-badge {
      display: inline-block;
      background: var(--badge-mining);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .stop-btn {
      width: 100%;
      background: var(--accent-stop);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .stop-btn:active {
      opacity: 0.7;
    }
    .energy-bar {
      height: 10px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .energy-fill {
      background: var(--energy-bar);
      height: 100%;
      width: 50%;
      transition: width 0.3s ease;
    }
    .recent-blocks {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .recent-blocks li {
      background: var(--card-bg);
      margin-bottom: 8px;
      padding: 12px;
      border-radius: 8px;
    }
    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .reward-tag {
      padding: 2px 6px;
      border-radius: 4px;
      color: #000;
      font-family: 'Source Code Pro', monospace;
      font-size: 12px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    .close-btn {
      margin-top: 12px;
      background: var(--badge-reward);
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Memhash</h1>
    <div class="card">
      <div class="profile-grid">
        <div>
          <div class="label">Баланс</div>
          <div class="value">348.002</div>
        </div>
        <div>
          <div class="label">Энергия</div>
          <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
        </div>
        <div>
          <div class="label">Блок</div>
          <div class="value">1056</div>
        </div>
        <div>
          <div class="label">Сложность</div>
          <div class="value">0.0004</div>
        </div>
        <div>
          <div class="label">Награда</div>
          <div class="value">0.0123</div>
        </div>
        <div>
          <div class="label">Онлайн</div>
          <div class="value">120</div>
        </div>
      </div>
    </div>
    <div class="card">
      <span class="status-badge">Майнинг</span>
      <div class="profile-grid">
        <div>
          <div class="label">Shares</div>
          <div class="value">12</div>
        </div>
        <div>
          <div class="label">Хэши</div>
          <div class="value">1520</div>
        </div>
        <div>
          <div class="label">Доход</div>
          <div class="value">0.0012</div>
        </div>
      </div>
      <button class="stop-btn" id="toggleBtn">Остановить</button>
    </div>
    <h2>Недавние блоки</h2>
    <ul class="recent-blocks" id="blockList">
      <!-- items added by JS -->
    </ul>
  </div>
  <div class="modal" id="blockModal">
    <div class="modal-content">
      <h2>Детали блока</h2>
      <pre id="blockHash" style="white-space:pre-wrap;overflow-x:auto;background:#111;padding:8px;font-family:'Source Code Pro',monospace;color:#fff;"></pre>
      <button class="close-btn" id="closeModal">Понятно</button>
    </div>
  </div>
  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.addEventListener('click', () => {
      toggleBtn.disabled = true;
      toggleBtn.style.opacity = '0.7';
      setTimeout(() => {
        toggleBtn.disabled = false;
        toggleBtn.style.opacity = '1';
      }, 300);
    });

    // mock recent blocks
    const blocks = [
      {id: 1055, reward: 0.0023, hash: '000000acbd'},
      {id: 1054, reward: 0, hash: '000000ef12'},
      {id: 1053, reward: 0.0011, hash: '00000098ab'}
    ];
    const list = document.getElementById('blockList');
    blocks.forEach(b => {
      const li = document.createElement('li');
      const header = document.createElement('div');
      header.className = 'block-header';
      const num = document.createElement('span');
      num.textContent = `Блок #${b.id}`;
      header.appendChild(num);
      const tag = document.createElement('span');
      tag.className = 'reward-tag';
      tag.style.background = b.reward > 0 ? 'var(--badge-reward)' : 'var(--badge-reward-zero)';
      tag.textContent = `Моя награда → ${b.reward}`;
      header.appendChild(tag);
      li.appendChild(header);
      const created = document.createElement('div');
      created.style.fontSize = '12px';
      created.textContent = 'Создано в ... Ник';
      li.appendChild(created);
      li.addEventListener('click', () => showModal(b.hash));
      list.appendChild(li);
    });

    const modal = document.getElementById('blockModal');
    const blockHash = document.getElementById('blockHash');
    const closeBtn = document.getElementById('closeModal');
    function showModal(hash) {
      blockHash.textContent = hash;
      modal.style.display = 'flex';
    }
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });
  </script>
</body>
</html>
